version: '3.8'

# Phase 10: Observability stack for Ai-HRMS production.
# Start with: docker compose -f docker-compose.monitoring.yml up -d
# Access:
#   Prometheus  → http://localhost:9090
#   Grafana     → http://localhost:3003  (admin / ${GRAFANA_PASSWORD:-admin})
#   Loki        → http://localhost:3100  (internal, queried via Grafana)

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ai-hrms-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.2
    container_name: ai-hrms-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
      GF_LOG_LEVEL: warn
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring

  loki:
    image: grafana/loki:2.9.8
    container_name: ai-hrms-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  # Optional: Promtail ships NestJS JSON logs from /var/log/ai-hrms to Loki.
  # Mount the host log directory matching your backend LOG_FILE path.
  promtail:
    image: grafana/promtail:2.9.8
    container_name: ai-hrms-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log/ai-hrms:/var/log/ai-hrms:ro
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  monitoring:
    driver: bridge
